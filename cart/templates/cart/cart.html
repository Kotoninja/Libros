<section hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>
    <div class="container">
        <div class="row">
            <!-- ========== Start Cart ========== --> 
            <div class="col-8 px-1">
                <div class="bg-light rounded-4 p-3">
                    <!-- ========== Start Cart Description ========== -->
                    <h1 class="mb-0">Cart</h1>
                    <span class="text-body-tertiary"><span hx-get="{% url 'cart:len' %}" hx-trigger="cartCounterUpdate from:body">{{cart|length}}</span> items</span>
                    <!-- ========== End Cart Description ========== -->
                    
                    <hr>

                    <!-- ========== Start Items ========== -->
                    <div>
                        {% for item in cart %}
                            {% include "cart/cart_item.html" %}
                        {% endfor %}
                    </div>
                    <!-- ========== End Items ========== -->
                </div>
            </div>
            <!-- ========== End Cart ========== -->
            
            
            <!-- ========== Start Order ========== -->
            <div class="col-4 px-1">
                <div class="bg-light p-3 rounded-4"> 
                    <h4>Select delivery address</h4>
                    <div class="px-4 text-body-secondary d-flex justify-content-between align-items-center">
                        <span class="fs-5"> Number of items: <span hx-get="{% url 'cart:len' %}" hx-trigger="cartCounterUpdate from:body">{{cart|length}}</span></span>
                        <span hx-post="{% url 'cart:get_total_price' %}" hx-trigger="cartPriceUpdate from:body" class="fs-5 float-end">{{cart.get_total_price}}</span>
                    </div>
                    <div class="px-4 text-body-secondary my-2 d-flex justify-content-between align-items-center">
                        <span class="fs-5">My discount</span>
                        <span class="fs-5">-0 &#8381</span>
                    </div>
                    
                    <hr>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fs-1"><strong>Total: <span hx-get="{% url 'cart:len' %}" hx-trigger="cartCounterUpdate from:body">{{cart|length}}</span></strong></span>
                        <span class="fs-5"><span hx-post="{% url 'cart:get_total_price' %}" hx-trigger="cartPriceUpdate from:body" class="fs-5 float-end">{{cart.get_total_price}}</span> &#8381</span>
                    </div>
                    
                    <button class="btn btn-primary w-100 fs-3 cursor-not-allowed"><strong>Order</strong></button>
                </div>
            </div>
            <!-- ========== End Order ========== -->
        </div>
    </div>
</section>
